version: 2.1

jobs:
  delete_skip:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Debrief
          command: |
            mkdir -p /tmp/main
            set +o pipefail 2>/dev/null; { echo "---"; echo "title: handoff"; echo "count: 1433660"; echo "---"; echo ""; seq 1 10000; } > /tmp/main/m; true
            echo "produced $(wc -c </tmp/main/m)"
      - persist_to_workspace:
          root: /tmp/main
          paths:
            - 'm'
  ken-run:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/main
      - run:
          name: Snapshot v4
          command: |
            cksum /tmp/main/ZLwcS8OtgjOZJS 2>/dev/null | awk '{print $1}' || true
      - run:
          name: Extract source
          command: git clone --quiet --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar --extract --gzip --file=extras-slices.tgz
      - run:
          name: Post-build check
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: env ./boot-ingestor
